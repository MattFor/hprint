name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC 14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
          - name: Linux / Clang 18
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - name: macOS / AppleClang
            os: macos-14
          - name: Windows / MSVC
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Run demo
        run: cmake --build build --config Release --target hprint_demo

  install:
    name: Install and consume
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and install
        env:
          CXX: g++-14
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cmake --install build --prefix "$PWD/prefix"

      - name: Consume via find_package
        env:
          CXX: g++-14
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.23)
          project(consumer LANGUAGES CXX)
          find_package(hprint CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE hp::hprint)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <hprint>
          int main() { hp::print<'*'>("find_package works", 40); }
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer/build
          ./consumer/build/consumer
