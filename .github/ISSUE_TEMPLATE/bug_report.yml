name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that shows it
      render: cpp
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hprint version
      description: '`HPRINT_VERSION_STRING`'
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Compiler and system
      description: Compiler and version, OS, terminal.
    validations:
      required: true
